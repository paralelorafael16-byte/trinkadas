              ...post,
              isLiked: !post.isLiked,
              likes: post.isLiked ? post.likes - 1 : post.likes + 1

            )}

            {/* ---------------- 5. PROFILE TAB ---------------- */}
            {activeTab === 'profile' && (
              <div className="p-4 space-y-5">
                
                {/* Profile Header */}
                <div className="flex items-center justify-between">
                  <div className="relative">
                    <img 
                      src={INFLUENCER_PROFILE.avatar} 
                      alt={INFLUENCER_PROFILE.name} 
                      className="w-20 h-20 rounded-full object-cover ring-2 ring-pink-500 p-0.5"
                    />
                  </div>

                  {/* Stats */}
                  <div className="flex items-center gap-6 text-center">
                    <div>
                      <div className="text-sm font-bold text-white">{INFLUENCER_PROFILE.postsCount}</div>
                      <div className="text-[11px] text-neutral-400">Posts</div>
                    </div>
                    <div>
                      <div className="text-sm font-bold text-white">{INFLUENCER_PROFILE.followers}</div>
                      <div className="text-[11px] text-neutral-400">Alunas</div>
                    </div>
                    <div>
                      <div className="text-sm font-bold text-white">{INFLUENCER_PROFILE.following}</div>
                      <div className="text-[11px] text-neutral-400">Seguindo</div>
                    </div>
                  </div>
                </div>

                {/* Bio & Links */}
                <div className="space-y-1">
                  <div className="flex items-center gap-1">
                    <h2 className="text-xs font-bold text-white">{INFLUENCER_PROFILE.name}</h2>
                    <CheckCircle className="w-3.5 h-3.5 text-pink-400 fill-pink-400/20" />
                  </div>
                  <p className="text-xs text-neutral-300 whitespace-pre-line leading-relaxed">
                    {INFLUENCER_PROFILE.bio}
                  </p>
                  <a 
                    href="https://www.instagram.com/mari.marques_/" 
                    target="_blank" 
                    rel="noreferrer"
                    className="text-xs font-semibold text-pink-400 hover:underline flex items-center gap-1 pt-1"
                  >
                    instagram.com/mari.marques_
                    <ExternalLink className="w-3 h-3" />
                  </a>
                </div>

                {/* Profile CTA Buttons */}
                <div className="flex items-center gap-2 pt-1">
                  <button 
                    onClick={() => setActiveTab('marketplace')}
                    className="flex-1 bg-gradient-to-r from-pink-500 to-rose-600 text-white text-xs font-bold py-2.5 rounded-xl shadow-md hover:brightness-110 transition"
                  >
                    Ver Projetos Fit
                  </button>
                  <button 
                    onClick={() => setIsInfluencerMode(!isInfluencerMode)}
                    className="px-4 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs font-semibold py-2.5 rounded-xl border border-neutral-700 transition"
                  >
                    {isInfluencerMode ? 'Visão Aluna' : 'Modo Criadora'}
                  </button>
                </div>

                {/* Profile Grid Grid Photos */}
                <div className="pt-4 border-t border-neutral-800">
                  <div className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-3 flex items-center justify-center gap-2">
                    <Film className="w-4 h-4 text-pink-400" />
                    Publicações da Mari
                  </div>
                  <div className="grid grid-cols-3 gap-1">
                    {posts.map(p => (
                      <div key={p.id} className="aspect-square bg-neutral-900 overflow-hidden relative group">
                        <img src={p.images[0]} alt="Post thumbnail" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2 text-white text-xs font-bold">
                          <Heart className="w-4 h-4 fill-white" />
                          {p.likes}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* ================= STORY FULLSCREEN MODAL ================= */}
          {activeStoryIndex !== null && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between max-w-md mx-auto">
              {/* Progress Bar */}
              <div className="absolute top-3 inset-x-3 z-20 flex gap-1">
                <div className="h-1 flex-1 bg-white/40 rounded-full overflow-hidden">
                  <div className="h-full bg-white animate-[pulse_3s_linear]" />
                </div>
              </div>

              {/* Story Top Info Bar */}
              <div className="relative z-20 pt-6 px-4 flex items-center justify-between text-white">
                <div className="flex items-center gap-2">
                  <img 
                    src={stories[activeStoryIndex].userAvatar} 
                    alt={stories[activeStoryIndex].username} 
                    className="w-8 h-8 rounded-full border border-pink-500 object-cover"
                  />
                  <span className="text-xs font-bold">{stories[activeStoryIndex].username}</span>
                  <span className="text-[10px] text-neutral-300">{stories[activeStoryIndex].time}</span>
                </div>
                <button onClick={() => setActiveStoryIndex(null)} className="p-1">
                  <X className="w-6 h-6 text-white" />
                </button>
              </div>

              {/* Story Main Image */}
              <img 
                src={stories[activeStoryIndex].media} 
                alt="Story media" 
                className="absolute inset-0 w-full h-full object-cover"
              />

              {/* Story Bottom Caption & Reaction Input */}
              <div className="relative z-20 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent space-y-3">
                <p className="text-xs text-white font-medium bg-black/40 p-2.5 rounded-xl backdrop-blur-sm border border-white/10">
                  {stories[activeStoryIndex].caption}
                </p>
                <div className="flex items-center gap-2">
                  <input 
                    type="text" 
                    placeholder={`Responder a ${stories[activeStoryIndex].username}...`}
                    className="flex-1 bg-white/10 border border-white/20 rounded-full px-4 py-2.5 text-xs text-white placeholder-neutral-300 focus:outline-none backdrop-blur-md"
                  />
                  <button 
                    onClick={() => { alert("Reação enviada!"); setActiveStoryIndex(null); }}
                    className="p-2.5 rounded-full bg-pink-600 text-white"
                  >
                    <Heart className="w-5 h-5 fill-white" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= INFLUENCER CREATE CONTENT MODAL ================= */}
          {showCreateModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 max-w-md mx-auto">
              <div className="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-neutral-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                    <Sparkles className="w-4 h-4 text-pink-400" />
                    Painel da Mari Marques
                  </h3>
                  <button onClick={() => setShowCreateModal(false)} className="text-neutral-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {/* Type Selector */}
                <div className="flex bg-neutral-950 p-1 rounded-xl border border-neutral-800">
                  <button 
                    onClick={() => setCreateType('post')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${createType === 'post' ? 'bg-pink-600 text-white' : 'text-neutral-400'}`}
                  >
                    Novo Post Feed
                  </button>
                  <button 
                    onClick={() => setCreateType('story')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${createType === 'story' ? 'bg-pink-600 text-white' : 'text-neutral-400'}`}
                  >
                    Novo Story
                  </button>
                </div>

                <form onSubmit={handleCreateContent} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-neutral-300 block mb-1">URL da Imagem / Foto</label>
                    <input 
                      type="text" 
                      value={newPostImageUrl}
                      onChange={(e) => setNewPostImageUrl(e.target.value)}
                      placeholder="https://sua-foto-aqui.com/imagem.jpg (Opcional)"
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white placeholder-neutral-600 focus:outline-none focus:border-pink-500"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-neutral-300 block mb-1">Legenda / Texto</label>
                    <textarea 
                      rows={3}
                      value={newPostCaption}
                      onChange={(e) => setNewPostCaption(e.target.value)}
                      placeholder="Escreva algo motivacional sobre o treino ou projeto..."
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white placeholder-neutral-600 focus:outline-none focus:border-pink-500 resize-none"
                      required
                    />
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg hover:brightness-110 transition"
                  >
                    Publicar Agora
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ================= CHECKOUT MODAL (PROJETO TRINKADAS) ================= */}
          {showCheckoutModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-end sm:items-center justify-center max-w-md mx-auto">
              <div className="bg-neutral-900 border border-pink-500/30 rounded-t-3xl sm:rounded-3xl p-5 w-full space-y-4 shadow-2xl animate-in slide-in-from-bottom">
                <div className="flex items-center justify-between border-b border-neutral-800 pb-3">
                  <div>
                    <h3 className="text-sm font-bold text-white">Inscrição no Projeto TRINKADAS</h3>
                    <p className="text-[10px] text-pink-400">15 dias com acompanhamento da Mari Marques</p>
                  </div>
                  <button onClick={() => setShowCheckoutModal(false)} className="text-neutral-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {paymentStep === 1 ? (
                  <div className="space-y-4">
                    <div className="bg-neutral-950 p-3 rounded-xl border border-neutral-800 flex items-center justify-between">
                      <span className="text-xs text-neutral-300">Valor da Vaga:</span>
                      <span className="text-base font-extrabold text-pink-400">R$ 49,90</span>
                    </div>

                    <div className="space-y-2">
                      <input 
                        type="text" 
                        placeholder="Seu Nome Completo" 
                        defaultValue="Ana Paula Souza"
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-pink-500"
                      />
                      <input 
                        type="email" 
                        placeholder="Seu Melhor E-mail" 
                        defaultValue="ana.paula@email.com"
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-pink-500"
                      />
                      <input 
                        type="text" 
                        placeholder="WhatsApp com DDD" 
                        defaultValue="(41) 99999-8888"
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-2.5 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-pink-500"
                      />
                    </div>

                    <button 
                      onClick={handleCompletePurchase}
                      className="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-xs py-3.5 rounded-xl shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2 uppercase tracking-wider"
                    >
                      <Shield className="w-4 h-4" />
                      Confirmar Inscrição PIX / Cartão
                    </button>
                  </div>
                ) : (
                  <div className="py-8 text-center space-y-3">
                    <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto animate-bounce">
                      <CheckCircle className="w-8 h-8" />
                    </div>
                    <h4 className="text-base font-bold text-white">Processando Pagamento...</h4>
                    <p className="text-xs text-neutral-400">Você será liberada para o Grupo do WhatsApp e Planilhas em instantes.</p>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================= BOTTOM NAVIGATION BAR ================= */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-neutral-950/95 backdrop-blur-lg border-t border-neutral-800/80 py-2 px-6 flex items-center justify-between z-40">
            
            {/* Feed Tab */}
            <button 
              onClick={() => setActiveTab('feed')}
              className={`flex flex-col items-center gap-0.5 transition ${activeTab === 'feed' ? 'text-pink-500' : 'text-neutral-400 hover:text-neutral-200'}`}
            >
              <Home className="w-6 h-6" />
              <span className="text-[9px] font-medium">Feed</span>
            </button>

            {/* Reels Tab */}
            <button 
              onClick={() => setActiveTab('reels')}
              className={`flex flex-col items-center gap-0.5 transition ${activeTab === 'reels' ? 'text-pink-500' : 'text-neutral-400 hover:text-neutral-200'}`}
            >
              <Film className="w-6 h-6" />
              <span className="text-[9px] font-medium">Reels</span>
            </button>

            {/* Marketplace / Projeto Trinkadas Tab */}
            <button 
              onClick={() => setActiveTab('marketplace')}
              className={`flex flex-col items-center gap-0.5 relative transition ${activeTab === 'marketplace' ? 'text-pink-500' : 'text-neutral-400 hover:text-neutral-200'}`}
            >
              <div className="relative">
                <ShoppingBag className="w-6 h-6" />
                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-pink-500 rounded-full animate-ping" />
              </div>
              <span className="text-[9px] font-bold">Projetos</span>
            </button>

            {/* Live Tab */}
            <button 
              onClick={() => { setActiveTab('live'); setIsLiveActive(true); }}
              className={`flex flex-col items-center gap-0.5 transition ${activeTab === 'live' ? 'text-pink-500' : 'text-neutral-400 hover:text-neutral-200'}`}
            >
              <Radio className="w-6 h-6 text-rose-500 animate-pulse" />
              <span className="text-[9px] font-medium">Live</span>
            </button>

            {/* Profile Tab */}
            <button 
              onClick={() => setActiveTab('profile')}
              className={`flex flex-col items-center gap-0.5 transition ${activeTab === 'profile' ? 'text-pink-500' : 'text-neutral-400 hover:text-neutral-200'}`}
            >
              <User className="w-6 h-6" />
              <span className="text-[9px] font-medium">Perfil</span>
            </button>

          </nav>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
